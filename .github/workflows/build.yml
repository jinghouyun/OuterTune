name: Build and Deploy APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Android SDK 环境
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          yes | sdkmanager --licenses || true

      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 构建 Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 复制 APK
        run: |
          find app/build/outputs/apk -name "*.apk"
          cp app/build/outputs/apk/debug/app-debug.apk app.apk
          ls -lh app.apk

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app.apk

      - name: 推送到 apk 分支
        run: |
          mkdir -p /tmp/apk-deploy
          cd /tmp/apk-deploy
          git init -b apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp $GITHUB_WORKSPACE/app.apk .
          git add app.apk
          git commit -m "apk"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk
